spring:
  application:
    name: spring-starter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: update   # fine for dev; use Flyway/Liquibase for production
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
